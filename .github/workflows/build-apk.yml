name: Build Pest Place MAME4droid APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;21.4.7075529

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Download MAME4droid native source
        run: |
          git clone --depth 1 https://github.com/seleuco/MAME4droid_Native.git native

      - name: Download MAME4droid Android project
        run: |
          git clone --depth 1 https://github.com/seleuco/MAME4droid-0.139u1-.git android

      - name: Apply Pest Place color correction
        working-directory: native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          video = Path("src/mame/video/dkong.c")
          text = video.read_text()

          # Pest Place専用パレット
          if "PALETTE_INIT( pestplce)" not in text:
              marker = "PALETTE_INIT( dkong2b)"

              palette = """PALETTE_INIT( pestplce)
          {
              dkong_state *state = machine->driver_data<dkong_state>();
              int i;

              /*
               * Pest Place PROM.
               * ROMREGION_INVERT has already inverted the data.
               * Do NOT invert again.
               */

              for (i = 0; i < 256; i++)
              {
                  UINT8 prom_a = color_prom[i];
                  UINT8 prom_b = color_prom[i + 0x100];

                  /* Pest Place hardware PROM wiring */
                  int r = (((prom_b >> 3) & 1) << 3) |
                          (((prom_b >> 2) & 1) << 2) |
                          (((prom_b >> 1) & 1) << 1) |
                          ((prom_b >> 3) & 1);

                  int g = (((prom_b >> 0) & 1) << 3) |
                          (((prom_a >> 3) & 1) << 2) |
                          (((prom_a >> 2) & 1) << 1) |
                          ((prom_b >> 0) & 1);

                  int b = (((prom_a >> 1) & 1) << 3) |
                          (((prom_a >> 0) & 1) << 2) |
                          (((prom_a >> 1) & 1) << 1) |
                          ((prom_a >> 0) & 1);

                  r = (r << 4) | r;
                  g = (g << 4) | g;
                  b = (b << 4) | b;

                  palette_set_color_rgb(machine, i, r, g, b);
              }

              palette_normalize_range(machine->palette, 0, 255, 0, 255);

              color_prom += 512;
              state->color_codes = color_prom;
          }

          """

              if marker not in text:
                  raise SystemExit("PALETTE_INIT(dkong2b) not found")

              text = text.replace(marker, palette + marker, 1)

          # Pest Place専用背景カラー
          if "static TILE_GET_INFO( pestplce_bg_tile_info )" not in text:
              marker = "static TILE_GET_INFO( dkong_bg_tile_info )"

              tileinfo = """static TILE_GET_INFO( pestplce_bg_tile_info )
          {
              dkong_state *state = machine->driver_data<dkong_state>();
              int code = state->video_ram[tile_index] + 256 * state->gfx_bank;
              int color = (state->color_codes[tile_index % 32] & 0x0f)
                        + 0x10 * state->palette_bank;

              SET_TILE_INFO(0, code, color, 0);
          }

          """

              if marker not in text:
                  raise SystemExit("dkong_bg_tile_info not found")

              text = text.replace(marker, tileinfo + marker, 1)

          # Pest Place専用VIDEO_START
          if "VIDEO_START( pestplce )" not in text:
              marker = "VIDEO_START( dkong )"

              video_start = """VIDEO_START( pestplce )
          {
              dkong_state *state = machine->driver_data<dkong_state>();

              VIDEO_START_CALL(dkong_base);

              state->bg_tilemap =
                  tilemap_create(machine,
                                 pestplce_bg_tile_info,
                                 tilemap_scan_rows,
                                 8, 8, 32, 32);

              tilemap_set_scrolldx(state->bg_tilemap, 0, 128);
          }

          """

              if marker not in text:
                  raise SystemExit("VIDEO_START(dkong) not found")

              text = text.replace(marker, video_start + marker, 1)

          video.write_text(text)

          # ヘッダー
          header = Path("src/mame/includes/dkong.h")
          htext = header.read_text()

          if "PALETTE_INIT( pestplce );" not in htext:
              marker = "PALETTE_INIT( dkong2b );"

              if marker not in htext:
                  raise SystemExit("dkong.h palette declaration not found")

              htext = htext.replace(
                  marker,
                  marker + "\nPALETTE_INIT( pestplce );",
                  1
              )

          if "VIDEO_START( pestplce );" not in htext:
              marker = "VIDEO_START( dkong );"

              if marker not in htext:
                  raise SystemExit("dkong.h video declaration not found")

              htext = htext.replace(
                  marker,
                  marker + "\nVIDEO_START( pestplce );",
                  1
              )

          header.write_text(htext)

          # Pest Placeのマシンドライバ
          driver = Path("src/mame/drivers/dkong.c")
          dtext = driver.read_text()

          old = "MDRV_PALETTE_INIT(dkong2b)  /* wrong! */"
          new = "MDRV_PALETTE_INIT(pestplce)"

          if old not in dtext:
              raise SystemExit("Pest Place machine driver not found")

          dtext = dtext.replace(old, new, 1)

          if "MDRV_VIDEO_START(pestplce)" not in dtext:
              dtext = dtext.replace(
                  new,
                  new + "\n    MDRV_VIDEO_START(pestplce)",
                  1
              )

          driver.write_text(dtext)

          print("Pest Place color correction v3 applied.")
      - name: Prepare native build tools
        working-directory: native
        run: |
          rm -rf obj prec-build
          mkdir -p prec-build

          gcc -O2 \
            src/build/file2str.c \
            -o prec-build/file2str

          gcc -O2 \
            src/build/verinfo.c \
            -o prec-build/verinfo

          gcc -O2 \
            src/emu/cpu/m68000/m68kmake.c \
            -o prec-build/m68kmake

          gcc -O2 \
            -DINLINE='static inline' \
            -Isrc \
            -Isrc/osd \
            -Isrc/osd/osdmini \
            src/emu/cpu/tms57002/tmsmake.c \
            -o prec-build/tmsmake

          touch prec-build/png2bdc

          make -j2 \
            TARGET=mame \
            SUBTARGET=mame \
            ANDROID= \
            OSD=osdmini \
            CROSS_BUILD=0 \
            TARGETOS=unix \
            NOWERROR=1 \
            buildtools

          g++ \
            obj/osdmini/mame/build/png2bdc.o \
            obj/osdmini/mame/libutil.a \
            obj/osdmini/mame/libocore.a \
            -lz \
            -o prec-build/png2bdc

          echo "Native build tools ready."

      - name: Build ARMv7 MAME core
        working-directory: native
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
        run: |
          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          make -j2 \
            TARGET=mame \
            SUBTARGET=mame \
            OSD=droid-ios \
            CROSS_BUILD=1 \
            ANDROID=1 \
            AARMV7=1 \
            AARMV8= \
            CLANG=1 \
            NEWCLANG=1 \
            NOWERROR=1 \
            MYPREFIX="$TOOLCHAIN/" \
            CC="$TOOLCHAIN/clang" \
            LD="$TOOLCHAIN/clang++" \
            AR="$TOOLCHAIN/llvm-ar"

          test -f mame
          file mame

      - name: Build ARM64 MAME core
        working-directory: native
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
        run: |
          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          make -j2 \
            TARGET=mame \
            SUBTARGET=mame \
            OSD=droid-ios \
            CROSS_BUILD=1 \
            ANDROID=1 \
            AARMV7= \
            AARMV8=1 \
            CLANG=1 \
            NEWCLANG=1 \
            NOWERROR=1 \
            MYPREFIX="$TOOLCHAIN/" \
            CC="$TOOLCHAIN/clang" \
            LD="$TOOLCHAIN/clang++" \
            AR="$TOOLCHAIN/llvm-ar"

          test -f mame64
          file mame64

      - name: Install native libraries into Android project
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp native/mame \
            android/app/src/main/jniLibs/armeabi-v7a/libMAME4droid.so

          cp native/mame64 \
            android/app/src/main/jniLibs/arm64-v8a/libMAME4droid.so

          ls -lh android/app/src/main/jniLibs/armeabi-v7a/
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Make Pest Place app standalone
        working-directory: android
        run: |
          sed -i \
            's/applicationId "com.seleuco.mame4droid"/applicationId "com.seleuco.mame4droid.pestplace"/' \
            app/build.gradle

          sed -i \
            's/ndkVersion "21.3.6528147"/ndkVersion "21.4.7075529"/' \
            app/build.gradle

          sed -i \
            's#<string name="app_name">.*</string>#<string name="app_name">MAME4droid Pest Place</string>#' \
            app/src/main/res/values/strings.xml

          echo "Standalone package:"
          grep applicationId app/build.gradle
          grep ndkVersion app/build.gradle
          grep 'app_name' app/src/main/res/values/strings.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign APK
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"

          keytool -genkeypair \
            -keystore pestplace-release.keystore \
            -storepass changeit \
            -keypass changeit \
            -alias pestplace \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PestPlace-MAME4droid, OU=PestPlace, O=PestPlace, L=Japan, ST=Kanagawa, C=JP"

          SIGNED="app/build/outputs/apk/release/MAME4droid Pest Place-release.apk"

          apksigner sign \
            --ks pestplace-release.keystore \
            --ks-key-alias pestplace \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "$SIGNED" \
            "$APK"

          apksigner verify --verbose "$SIGNED"
          rm -f "$APK" pestplace-release.keystore
      - name: Find APK
        run: |
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PestPlace-MAME4droid
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
